name: Publish Prompt Mage
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -c "import tomllib; p=tomllib.load(open('pyproject.toml','rb')); assert p['tool']['comfy'].get('PublisherId'), 'Set the real Comfy Registry PublisherId first'"
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install 'transformers==5.17.0' Pillow aiohttp
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/test_connections.mjs
      - run: node tests/test_menu.mjs
      - run: node tests/test_status.mjs
      - run: node tests/test_upload.mjs
      - run: node tests/test_batch_runner.mjs
      - run: node tests/test_archmage_ui.mjs
      - run: node tests/test_openai_key.mjs
      - run: node tests/test_foundry_ui.mjs
  publish:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check publishing key
        env:
          REGISTRY_ACCESS_TOKEN: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
        run: test -n "$REGISTRY_ACCESS_TOKEN"
      - uses: Comfy-Org/publish-node-action@main
        with:
          personal_access_token: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
