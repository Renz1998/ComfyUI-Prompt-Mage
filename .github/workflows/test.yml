name: Regression tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        transformers: ["4.46.3", "5.17.0"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install transformers==${{ matrix.transformers }} Pillow
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node tests/test_connections.mjs
      - run: node tests/test_menu.mjs
      - run: node tests/test_status.mjs
      - run: node tests/test_upload.mjs
      - run: node tests/test_batch_runner.mjs
      - run: node tests/test_archmage_ui.mjs
      - run: node tests/test_openai_key.mjs
      - run: node tests/test_deepseek_key.mjs
      - run: node tests/test_grimoire_ui.mjs
