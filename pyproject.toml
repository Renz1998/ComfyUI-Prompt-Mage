[project]
name = "prompt-mage"
description = "Prompt Mage turns words and photos into image prompts: Archmage with style presets and optional thinking, local vision captions, appearance overrides, DART expansion, and native MOSS JSON layouts."
version = "1.22.1"
requires-python = ">=3.10"
dependencies = ["transformers>=4.46,<6", "torch>=2.4", "huggingface-hub>=0.26", "pypdf>=5,<7"]
license = { file = "LICENSE" }
readme = "README.md"
keywords = ["comfyui", "prompt", "dart", "qwen", "vision", "moss", "caption"]

[project.urls]
Repository = "https://github.com/Renz1998/ComfyUI-Prompt-Mage"
Documentation = "https://github.com/Renz1998/ComfyUI-Prompt-Mage/blob/main/QUICKSTART.md"

[tool.comfy]
DisplayName = "Prompt Mage"
Icon = "https://raw.githubusercontent.com/Renz1998/ComfyUI-Prompt-Mage/main/assets/icon.svg"
Banner = "https://raw.githubusercontent.com/Renz1998/ComfyUI-Prompt-Mage/main/assets/banner.svg"
PublisherId = "renz1998"
